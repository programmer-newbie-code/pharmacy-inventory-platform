plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.programmernewbiecode.pharmaloka"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.programmernewbiecode.pharmaloka"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            def keyFilePath = keystoreProperties['storeFile'] ?: 'upload-keystore.jks'
            def keyFile = file(keyFilePath)
            def storePass = keystoreProperties['storePassword'] ?: System.getenv("KEYSTORE_PASSWORD")
            def keyPass = keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
            def alias = keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: "upload"

            if (keyFile.exists() && storePass) {
                storeFile keyFile
                storePassword storePass
                keyAlias alias
                keyPassword keyPass ?: storePass
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
