name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backfill platform folders
        run: flutter create --platforms=android --org com.programmernewbiecode .
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce 80% line coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # fix ci: also exclude generated l10n code (boilerplate, not authored/tested
          # directly), same rationale as excluding drift's *.g.dart.
          lcov --remove coverage/lcov.info '**/*.g.dart' 'lib/l10n/app_localizations*.dart' -o coverage/lcov_filtered.info
          lcov --summary coverage/lcov_filtered.info
          # fix ci: previous grep matched the literal dots in lcov's "lines......:"
          # padding instead of the percentage. Match the "N.N%" token directly.
          COVERAGE=$(lcov --summary coverage/lcov_filtered.info | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
          echo "Line coverage: $COVERAGE%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov + 0 < 80) { print "Coverage below 80%"; exit 1 } }'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backfill platform folders
        run: flutter create --platforms=windows --org com.programmernewbiecode .
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backfill platform folders
        run: flutter create --platforms=android --org com.programmernewbiecode .
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
