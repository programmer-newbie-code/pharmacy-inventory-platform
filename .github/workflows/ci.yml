name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  verify-signatures:
    name: Verify Commit Signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Commit Signature Status
        uses: actions/github-script@v7
        with:
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const verified = commit.data.commit.verification?.verified;
            const reason = commit.data.commit.verification?.reason;
            console.log(`Commit ${context.sha} GPG Verification: ${verified} (${reason})`);

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce 80% line coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info '**/*.g.dart' 'lib/l10n/app_localizations*.dart' 'lib/data/database.dart' -o coverage/lcov_filtered.info
          lcov --summary coverage/lcov_filtered.info
          COVERAGE=$(lcov --summary coverage/lcov_filtered.info | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
          echo "Line coverage: $COVERAGE%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov + 0 < 80) { print "Coverage below 80%"; exit 1 } }'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-Inject Dynamic Version into pubspec.yaml
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $ver = (git describe --tags --abbrev=0 2>$null)
            if (-not $ver) { $ver = "v1.2.0" }
            $ver = $ver.TrimStart('v')
          }
          Write-Host "Injecting dynamic version: $ver+$env:GITHUB_RUN_NUMBER"
          (Get-Content pubspec.yaml) -replace '^version: .*', "version: $ver+$env:GITHUB_RUN_NUMBER" | Set-Content pubspec.yaml
          echo "BUILD_VER=$ver" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backfill platform folders
        run: flutter create --platforms=windows --org com.programmernewbiecode .
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release --build-name=${{ env.BUILD_VER }} --build-number=${{ github.run_number }}
      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-Inject Dynamic Version into pubspec.yaml
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            if [ -z "$VER" ]; then VER="1.2.0"; fi
          fi
          echo "Injecting dynamic version: ${VER}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: ${VER}+${{ github.run_number }}/" pubspec.yaml
          echo "BUILD_VER=$VER" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --build-name=${{ env.BUILD_VER }} --build-number=${{ github.run_number }}
      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android, analyze-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: android-release
      - name: Package Windows Zip & Rename APK
        run: |
          cd windows-release && zip -r ../pharmacy-inventory-platform-windows-${{ github.ref_name }}.zip . && cd ..
          cp android-release/app-release.apk pharmacy-inventory-platform-android-${{ github.ref_name }}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pharmacy-inventory-platform-windows-${{ github.ref_name }}.zip
            pharmacy-inventory-platform-android-${{ github.ref_name }}.apk
          generate_release_notes: true

  deploy-gh-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build Jekyll documentation site
        run: |
          gem install jekyll jekyll-theme-cayman
          jekyll build -s docs_site -d _site
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

